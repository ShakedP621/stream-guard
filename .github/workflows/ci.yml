name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  BUILD_TYPE: Debug

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- Configure ----------
      - name: Configure (CMake)
        run: |
          cmake -S . -B build ${{ matrix.os == 'windows-latest' && '-G "Visual Studio 17 2022" -A x64' || '' }} -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      # ---------- Build ----------
      - name: Build (ALL)
        run: |
          cmake --build build ${{ matrix.os == 'windows-latest' && '--config ' + env.BUILD_TYPE || '' }} --parallel
      - name: Build (explicit targets)
        # Ensure both the test binary and the CLI are produced before we run them.
        run: |
          cmake --build build ${{ matrix.os == 'windows-latest' && '--config ' + env.BUILD_TYPE || '' }} --parallel --target streamguard_tests streamguard_sim

      # ---------- Unit Tests ----------
      - name: Run ctest
        run: |
          ctest --test-dir build -C ${{ env.BUILD_TYPE }} --output-on-failure -j 4

      # ---------- CLI Smoke ----------
      - name: Simulator smoke (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          ./build/streamguard_sim --count 8 --seed 42 --json | head -n 1
          ./build/streamguard_sim --count 8 --seed 42 --threads multi --json | head -n 1

      - name: Simulator smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\build\${{ env.BUILD_TYPE }}\streamguard_sim.exe --count 8 --seed 42 --json | Select-Object -First 1
          .\build\${{ env.BUILD_TYPE }}\streamguard_sim.exe --count 8 --seed 42 --threads multi --json | Select-Object -First 1
